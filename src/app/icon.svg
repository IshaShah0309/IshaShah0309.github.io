<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Isha's monogram, in the archive's own colours. The I is drawn as one path
    rather than set in a typeface, so it renders identically everywhere and
    stays legible down at 16px in a browser tab. The waisted stem and the
    bracketed serifs echo the Cormorant used across the site.
  -->
