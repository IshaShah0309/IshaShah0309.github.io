  <rect x="2.5" y="2.5" width="59" height="59" rx="11" fill="none"
        stroke="#c29e5b" stroke-opacity="0.6" stroke-width="2"/>

  <path fill="#ecbd64" d="
    M19 15 H45 V21 H38.5
    C37.6 26.5 37.6 37.5 38.5 43
    H45 V49 H19 V43 H25.5
    C26.4 37.5 26.4 26.5 25.5 21
    H19 Z"/>
</svg>
