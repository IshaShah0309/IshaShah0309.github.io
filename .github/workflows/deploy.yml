name: Deploy to GitHub Pages

# Every push to main rebuilds the site and publishes it. The build output is
# a plain static export (see `output: "export"` in next.config.ts), so Pages
# serves it directly — there is no server and nothing to configure by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deployment finish rather than stacking them up.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Turns Pages on for the repository if it is not on already, so the very
      # first run does not fail against a repository that has never deployed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Set this in Settings → Secrets and variables → Actions → Variables
          # to the live URL, so sitemap.xml and robots.txt point at the real
          # site rather than the placeholder.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
